<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prosthetic Arm Simulation</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1a1a; font-family: -apple-system, sans-serif; color: #eee; }
  #layout { display: flex; height: 100vh; }
  #panel { width: 300px; padding: 16px; box-sizing: border-box; background: #242424; overflow-y: auto; }
  #panel h2 { font-size: 16px; margin: 0 0 12px; }
  #panel label { display: block; font-size: 12px; color: #aaa; margin: 12px 0 4px; }
  #panel select, #panel input { width: 100%; padding: 6px; box-sizing: border-box; background: #333; color: #eee; border: 1px solid #444; border-radius: 4px; }
  #panel button { width: 100%; padding: 8px; margin-top: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
  #start-btn { background: #2c7bb6; color: white; }
  #stop-btn { background: #d7191c; color: white; }
  #status { margin-top: 14px; font-size: 12px; color: #9c9; white-space: pre-wrap; }
  #viewport-wrap { flex: 1; position: relative; }
  #viewport { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 16px; bottom: 16px; font-family: monospace; font-size: 13px;
         white-space: pre-wrap; text-shadow: 0 0 4px black, 0 0 4px black; pointer-events: none; }
</style>
</head>
<body>

<div id="layout">
  <div id="panel">
    <h2>Prosthetic Sim</h2>

    <label for="age">Age</label>
    <input id="age" type="number" value="30" min="0" max="120">

    <label for="hand">Hand</label>
    <select id="hand">
      <option value="right" selected>Right</option>
      <option value="left">Left</option>
    </select>

    <label for="amputation">Amputation level</label>
    <select id="amputation">
      <option value="wrist" selected>Wrist</option>
      <option value="forearm">Forearm</option>
    </select>

    <label for="task">Task</label>
    <select id="task"></select>

    <button id="start-btn">Start Simulation</button>
    <button id="stop-btn">Stop Simulation</button>

    <div id="status">Loading model...</div>
  </div>

  <div id="viewport-wrap">
    <canvas id="viewport"></canvas>
    <div id="hud"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
